[project]
name = "clank"
version = "0.1.0"
description = "Agente LLM sencillo tipo OpenClaw con soporte multi-proveedor, interfaz CLI/web y ejecución aislada en Docker"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.50.0",
    "rich>=13.9.0",
    "prompt-toolkit>=3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "chainlit>=2.0.0",
    "docker>=7.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
]

[project.scripts]
clank = "clank.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"
